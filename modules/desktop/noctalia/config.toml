[bar.default]
center = [ "audio_visualizer", "control-center", "audio_visualizer" ]
end = [ "clipboard", "spacer_4", "tray", "spacer_4", "volume", "spacer_4", "clock", "spacer_4", "notifications" ]
start = [ "session", "spacer_2", "workspaces" ]

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-1", "lockscreen-login-box@DP-2" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "DP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "DP-2"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[osd.kinds]
media = false

[plugins]
enabled = []

[shell]
avatar_path = "/home/ethan/nixos-config/modules/desktop/noctalia/avatar/cashmoney profile pic.png"
polkit_agent = true
time_format = "{:%I:%M %p}"

    [shell.screenshot]
    directory = "/home/ethan/Pictures/Screenshots"

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = false
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "vibrant"

[wallpaper]
directory = "/home/ethan/nixos-config/modules/desktop/noctalia/wallpapers"
transition_on_startup = true

    [wallpaper.default]
    path = "/home/ethan/nixos-config/modules/desktop/noctalia/wallpapers/wallpapersden.com_godzilla-s-empire-reign_3840x2160.jpg"

    [wallpaper.last]
    path = "/home/ethan/nixos-config/modules/desktop/noctalia/wallpapers/wallpapersden.com_godzilla-s-empire-reign_3840x2160.jpg"

    [wallpaper.monitors.DP-1]
    path = "/home/ethan/nixos-config/modules/desktop/noctalia/wallpapers/wallpapersden.com_godzilla-s-empire-reign_3840x2160.jpg"

    [wallpaper.monitors.DP-2]
    path = "/home/ethan/nixos-config/modules/desktop/noctalia/wallpapers/wallpapersden.com_godzilla-s-empire-reign_3840x2160.jpg"

[weather]
unit = "imperial"

[widget.audio_visualizer]
show_when_idle = true
width = 205

    [widget.audio_visualizer.actions]
    left = "panel-toggle control-center media"

[widget.clock]
format = "{:%I:%M %p}"

[widget.control-center]
anchor = true
custom_image = "/home/ethan/nixos-config/modules/desktop/noctalia/avatar/Nix_snowflake.svg"

[widget.media]
hide_artist = true
hide_when_idle = true
hide_when_no_media = true
rotate_album_art = true
show_progress = true
title_scroll = "on_hover"

[widget.network]
enabled = false

    [widget.network.actions]
    right = "none"

[widget.spacer_2]
enabled = true
length = 27
type = "spacer"

[widget.spacer_3]
length = 120
type = "spacer"

[widget.spacer_4]
length = 10
type = "spacer"
